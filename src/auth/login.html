<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../common/styles.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-color: #f4f4f4;">

    <main>
        <section style="background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            <h1>Welcome Back!</h1>
            <form id="login-form" action="#">
                <fieldset>
                    <legend>Secure Login</legend>

                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required>

                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" minlength="8" required>

                    <button type="submit" id="login">Log In</button>
                </fieldset>

                <div id="message-container"></div>
            </form>
        </section>
    </main>

    <script src="login.js" defer></script>

</body>
</html>
