<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Character encoding -->
    <meta charset="UTF-8">

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Title -->
    <title>Login</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="d-flex justify-content-center align-items-center vh-100 bg-light">

    <main>
        <section class="card p-4 shadow" style="width: 320px;">

            <!-- Title -->
            <h2 class="text-center mb-3">Welcome Back!</h2>

            <!-- Form -->
            <form id="login-form" action="#" method="POST">

                <fieldset>

                    <legend class="text-center">Secure Login</legend>

                    <!-- Email -->
                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" id="email" name="email" class="form-control" required>
                    </div>

                    <!-- Password -->
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" name="password" class="form-control" minlength="8" required>
                    </div>

                    <!-- Button -->
                    <button type="submit" id="login" class="btn btn-primary w-100">
                        Log In
                    </button>

                </fieldset>

                <!-- Messages -->
                <div id="message-container" class="mt-3 text-center"></div>

            </form>

        </section>
    </main>

    <!-- JS -->
    <script src="./login.js" defer></script>

</body>
</html>
